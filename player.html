<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telephantim — Dual Relics</title>
  <!-- Used by X/Twitter player card + og:video embed -->
  <meta name="robots" content="noindex" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
    }
    video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>
<body>
  <video
    id="v"
    src="media/share/link-preview-relics.mp4?v=2026-08-share-v2"
    poster="media/share/link-preview-relics.jpg?v=2026-08-share-v2"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
  ></video>
  <script>
    (function () {
      var el = document.getElementById("v");
      if (!el) return;
      el.muted = true;
      el.playsInline = true;
      var p = el.play();
      if (p && p.catch) p.catch(function () {});
      // Re-kick if parent iframe blocks first play
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && el.paused) el.play().catch(function () {});
      });
    })();
  </script>
</body>
</html>
