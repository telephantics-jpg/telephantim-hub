<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Voltage Loft — Live Viewport</title>
  <link rel="stylesheet" href="css/viewport.css?v=v141-life" />
</head>
<body>
  <div id="app" class="app ambient-pulse">
    <!-- Full-bleed stage -->
    <div id="stage" class="stage" aria-live="polite">
      <div id="bg" class="bg" role="img" aria-label="Room view"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="ambient-glow" aria-hidden="true"></div>
      <div id="motes" class="motes" aria-hidden="true"></div>
      <div id="hotspots" class="hotspots"></div>
    </div>

    <!-- Top chrome -->
    <header class="chrome-top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>Voltage Loft</h1>
          <p class="subtitle">Live Viewport · Dynamic Session</p>
        </div>
      </div>
      <nav id="room-nav" class="room-nav" aria-label="Rooms"></nav>
      <div class="session-meters" aria-label="Session">
        <span id="live-badge" class="live-badge" title="Config feed">…</span>
        <div class="signal" title="Signal meter">
          <span class="signal-label">Signal</span>
          <div class="signal-bar"><span id="signal-fill" class="signal-fill"></span></div>
          <span id="signal-val" class="signal-val">0%</span>
        </div>
        <span id="session-clock" class="session-clock" title="Session clock">00:00</span>
      </div>
      <div class="chrome-actions">
        <button type="button" id="btn-back" class="btn ghost" title="Esc / Back">← Back</button>
      </div>
    </header>

    <!-- Dialogue panel -->
    <aside class="dialogue" id="dialogue">
      <div class="dialogue-head">
        <div class="avatar" aria-hidden="true">
          <span class="crystal"></span>
        </div>
        <div class="who">
          <strong>AGENT ALpha</strong>
          <span class="status"><span class="dot"></span> Online · Host</span>
        </div>
        <span id="room-tag" class="room-tag">Portal Gate</span>
      </div>
      <div id="chat" class="chat" role="log" aria-relevant="additions"></div>
      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="chat-input">Message ALpha</label>
        <input id="chat-input" type="text" maxlength="280" placeholder="Type to ALpha…" />
        <button type="submit" id="btn-send" class="btn primary compact">Send</button>
      </form>
      <div class="dialogue-actions">
        <button type="button" id="btn-talk" class="btn primary">Talk to ALpha</button>
        <button type="button" id="btn-enter" class="btn amber hidden">Step Through</button>
      </div>
    </aside>

    <!-- Footer hint -->
    <footer class="chrome-foot">
      <span id="hint">Live session · hotspots · chat · Esc toward Portal</span>
      <span class="coords" id="coords">1280×800</span>
    </footer>
  </div>
  <script src="js/app.js?v=v141-life"></script>
</body>
</html>
