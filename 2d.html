  <meta property="og:site_name" content="Telephantim" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #050810;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #camp {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #050810;
    }
    #gate {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(180deg, rgba(5,8,16,0.35), rgba(5,8,16,0.55)),
        url("media/share/og-luna-2d.jpg?v=2026-08-enter") center / cover no-repeat;
    }
    body.in #gate { display: none; }
    #enter {
      appearance: none;
      border: 2px solid #fde68a;
      background: linear-gradient(135deg, #7c2d12, #f59e0b 55%, #fde68a);
      color: #1c1917;
      font: 900 1.6rem/1 system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 1.05rem 2.8rem;
      min-width: 10rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 36px rgba(0,0,0,0.55), 0 0 28px rgba(251,191,36,0.45);
    }
    #enter:hover { filter: brightness(1.08); transform: translateY(-1px); }
    #enter:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <iframe
    id="camp"
    title="Luna Camp 2D"
    src="https://telephanti.com/firmament/play?hub=1"
    allow="autoplay; fullscreen"
  ></iframe>
  <div id="gate">
    <button type="button" id="enter">Enter</button>
  </div>
  <script>
    document.getElementById("enter").addEventListener("click", function () {
      document.body.classList.add("in");
    });
  </script>
</body>
</html>
